<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .profile-container {
            max-width: 950px;
            margin: 35px auto;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
        }

        .profile-title {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 25px;
        }

        /* PROFILE PHOTO */
        .profile-photo-section {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profile-photo,
        .profile-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 15px;
        }

        .profile-photo {
            object-fit: cover;
            border: 4px solid #2563eb;
        }

        .profile-placeholder {
            background: #EEF2FF;
            border: 4px solid #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .photo-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .photo-btn {
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .photo-btn.gallery {
            background: #4f46e5;
        }

        .photo-btn:hover {
            opacity: .9;
        }

        .photo-note {
            font-size: 12px;
            color: #64748B;
            margin-top: 10px;
        }

        /* Hide actual file inputs */
        .hidden-file-input {
            display: none;
        }

        /* FORM */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            background: #f8fafc;
            box-sizing: border-box;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #2563eb;
            outline: none;
            background: white;
            box-shadow: 0 0 8px rgba(37,99,235,.2);
        }

        .full-width {
            grid-column: 1 / 3;
        }

        .save-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg,#2563eb,#4f46e5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            opacity: .95;
        }

        @media(max-width:768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1 / 2;
            }

            .profile-container {
                margin: 20px 10px;
                padding: 20px;
            }
        }
    </style>
</head>

            {{ (user.email[0] if user.email else user.fullname[0]) | upper }}

             class="profile-photo"

           id="galleryInput"
           accept="image/*"
           class="hidden-file-input">

</div>

/* =========================================================
   SHOW SELECTED PHOTO
========================================================= */

function showPhotoPreview(input) {

    if (input.files && input.files[0]) {

        const file = input.files[0];

        // Maximum 5 MB
        if (file.size > 5 * 1024 * 1024) {

            alert("Profile photo must be less than 5 MB.");

            input.value = "";

            return;
        }


        // Check image
        if (!file.type.startsWith("image/")) {

            alert("Please select an image file.");

            input.value = "";

            return;
        }


        const reader = new FileReader();

        reader.onload = function(e) {

            const preview =
                document.getElementById("profilePreview");

            const placeholder =
                document.getElementById("profilePlaceholder");


            preview.src = e.target.result;

            preview.style.display = "block";


            if (placeholder) {
                placeholder.style.display = "none";
            }

        };

        reader.readAsDataURL(file);
    }
}


/* Camera selected */
document.getElementById("cameraInput")
    .addEventListener("change", function() {

        /*
         * Copy camera file to the gallery input.
         * This allows the selected camera photo
         * to be submitted with the form.
         */

        if (this.files.length > 0) {

            try {
                const dataTransfer = new DataTransfer();

                dataTransfer.items.add(this.files[0]);

                document.getElementById("galleryInput").files =
                    dataTransfer.files;

            } catch (error) {
                console.log(error);
            }

            showPhotoPreview(this);
        }

    });


/* Gallery selected */
document.getElementById("galleryInput")
    .addEventListener("change", function() {

        if (this.files.length > 0) {

            /*
             * Copy gallery file to camera input
             * so profile_photo is available for form submission.
             */

            try {
                const dataTransfer = new DataTransfer();

                dataTransfer.items.add(this.files[0]);

                document.getElementById("cameraInput").files =
                    dataTransfer.files;

            } catch (error) {
                console.log(error);
            }

            showPhotoPreview(this);
        }

    });

/* =========================================================
   LOAD DISTRICTS
========================================================= */

function loadDistricts() {

    const state =
        document.getElementById("state").value;

    const district =
        document.getElementById("district");

    const savedDistrict =
        "{{ user.district if user else '' }}";


    district.innerHTML =
        '<option value="">Select District</option>';


    if (districts[state]) {

        districts[state].forEach(function(item) {

            const option =
                document.createElement("option");

            option.value = item;

            option.textContent = item;


            if (item === savedDistrict) {
                option.selected = true;
            }


            district.appendChild(option);

        });

    }
}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener("DOMContentLoaded", function() {

    const state =
        document.getElementById("state").value;

    if (state) {
        loadDistricts();
    }

});
function openCamera() {
    document.getElementById("cameraInput").click();
